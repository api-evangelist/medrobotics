aid: medrobotics
name: Medrobotics
description: >-
  Medrobotics Corporation was a Raynham, Massachusetts surgical robotics manufacturer,
  founded as CardioRobotics, that built the Flex Robotic System — an articulating,
  steerable robotic endoscope platform cleared by the FDA in 2015 and CE-marked for
  minimally invasive procedures in otolaryngology, colorectal surgery and
  gastroenterology, and deployed at roughly thirty hospitals worldwide. The company was a
  medical device manufacturer, not a software vendor: its product was an operating-room
  capital robot and its single-use accessories, and it never operated a developer program,
  a public API, an SDK or a developer portal. Medrobotics filed for Chapter 7 bankruptcy
  in the U.S. Bankruptcy Court for the District of Massachusetts on 2022-01-24 (case
  1:22-bk-10077), following judgments in the Endobotics litigation, and in June 2024 the
  Chapter 7 trustee liquidated the entire 40,000-square-foot Raynham plant at auction —
  23 complete Flex and Flex360 systems plus roughly 22 terabytes of technical
  specifications, customer lists and other intellectual property. The company is defunct.
  Its domain, medrobotics.com, is now a parked page served by a domain-parking network and
  its registry nameservers are NS1/NS2.PENDINGRENEWALDELETION.COM. This profile is
  retained as an honest zero: there is no API surface to catalog, and there never was one.
